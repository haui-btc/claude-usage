services:
  claude-usage:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ~/.claude:/root/.claude
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SCAN_INTERVAL: "30"
      # Work/private split: path prefixes as they appear in the transcripts
      # (host paths, not container paths), several separated by ":".
      # Set it in .env, e.g. WORK_DIRS=/Users/me/Documents/acme
      # Empty/unset -> the filter is hidden and the dashboard behaves as before.
      WORK_DIRS: "${WORK_DIRS:-}"
      CLAUDE_ACCESS_TOKEN: "${CLAUDE_ACCESS_TOKEN:-}"
